<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>手机登录问题测试</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f6f8;
      --panel: #ffffff;
      --text: #1f2933;
      --muted: #637083;
      --line: #d9e2ec;
      --blue: #1769aa;
      --green: #1f8a5b;
      --red: #bf3a30;
      --amber: #a66500;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      line-height: 1.5;
    }

    main {
      width: min(760px, 100%);
      margin: 0 auto;
      padding: 18px;
    }

    header {
      padding: 8px 0 16px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 24px;
      letter-spacing: 0;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    section {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      margin: 14px 0;
      padding: 16px;
    }

    h2 {
      margin: 0 0 12px;
      font-size: 17px;
      letter-spacing: 0;
    }

    label {
      display: block;
      margin: 12px 0 6px;
      color: #334155;
      font-size: 14px;
      font-weight: 650;
    }

    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 11px 12px;
      color: var(--text);
      background: #fff;
      font: inherit;
    }

    textarea {
      min-height: 88px;
      resize: vertical;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 6px;
      padding: 13px 14px;
      background: var(--blue);
      color: #fff;
      font: inherit;
      font-weight: 700;
    }

    button:disabled {
      background: #8aa9c4;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .item {
      border-top: 1px solid var(--line);
      padding: 10px 0 0;
      min-width: 0;
    }

    .label {
      display: block;
      color: var(--muted);
      font-size: 12px;
    }

    .value {
      display: block;
      margin-top: 3px;
      word-break: break-word;
      font-weight: 650;
    }

    .status {
      display: inline-block;
      min-width: 82px;
      border-radius: 999px;
      padding: 3px 9px;
      text-align: center;
      font-size: 12px;
      font-weight: 700;
    }

    .testing { background: #fff4cf; color: var(--amber); }
    .success { background: #dff5e8; color: var(--green); }
    .error { background: #fde2df; color: var(--red); }

    .message {
      margin-top: 12px;
      font-size: 14px;
      color: var(--muted);
    }

    .notice {
      margin-top: 10px;
      border: 1px solid #f2c94c;
      border-radius: 8px;
      padding: 10px 12px;
      background: #fff8db;
      color: #6b4e00;
      font-size: 14px;
      font-weight: 700;
    }

    .inline-button {
      margin-top: 10px;
      background: #475569;
    }

    @media (max-width: 560px) {
      main { padding: 14px; }
      h1 { font-size: 21px; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>手机登录问题测试</h1>
      <p>请在发生无法登录时填写手机号并提交，系统会自动记录手机、浏览器和网络诊断信息。</p>
    </header>

    <section>
      <h2>测试人员填写</h2>
      <div class="notice">请填写真实号码，否则无法准确解决您的问题。号码和姓名仅作为解决本次问题使用！！！</div>

      <label for="tester-name">姓名（选填）</label>
      <input id="tester-name" autocomplete="name" placeholder="可填写测试人姓名">

      <label for="phone">电话号码</label>
      <input id="phone" inputmode="tel" autocomplete="tel" placeholder="请输入本机或测试手机号">

      <label for="province">所在省/直辖市</label>
      <select id="province" required>
        <option value="">加载中…</option>
      </select>

      <label for="city">所在城市</label>
      <select id="city" hidden>
        <option value="">请选择城市</option>
      </select>

      <label for="district">所在区/县</label>
      <select id="district" hidden>
        <option value="">请选择区/县</option>
      </select>

      <button class="inline-button" id="location-btn" type="button" hidden>授权获取定位</button>
      <div class="message" id="location-message" hidden></div>

    </section>

    <section id="diagnostics-section" hidden>
      <h2>网络诊断结果</h2>
      <div class="item"><span class="label">国内基础网络</span><span class="value"><span class="status testing" id="ping-domestic">待测试</span></span></div>
      <div class="item"><span class="label">目标网站 studio.atlascapture.io</span><span class="value"><span class="status testing" id="ping-target">待测试</span></span></div>
      <div class="item"><span class="label">海外公共依赖</span><span class="value"><span class="status testing" id="ping-google">待测试</span></span></div>
    </section>

    <button id="submit-btn" type="button">提交测试记录</button>
    <div class="message" id="message"></div>
  </main>

  <script>
    const TARGET_MAIN_SITE = 'https://studio.atlascapture.io/capture?code=';
    const recordsApi = '/api/records';
    const reportData = {
      testerName: '',
      phone: '',
      os: '未知',
      brand: '通用/其他',
      model: '',
      browser: '未知',
      loginResult: '',
      issue: '',
      notes: '',
      manualLocation: '',
      latitude: '',
      longitude: '',
      locationAccuracy: '',
      locationAddress: '',
      locationProvider: '',
      locationError: '',
      userAgent: navigator.userAgent,
      screen: `${window.screen.width}x${window.screen.height} DPR ${window.devicePixelRatio || 1}`,
      language: navigator.language || '',
      timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || '',
      clientIp: '',
      ispName: '',
      ipAsn: '',
      ipCountry: '',
      ipRegion: '',
      ipCity: '',
      networkEffectiveType: '',
      networkDownlink: '',
      networkRtt: '',
      networkType: '',
      networkSaveData: '',
      targetUrl: TARGET_MAIN_SITE,
      diagnostics: {},
    };

    const browserRules = [
      ['micromessenger', '微信内置浏览器'],
      ['mqqbrowser', 'QQ 浏览器'],
      ['huaweibrowser', '华为浏览器'],
      ['miuibrowser', '小米浏览器'],
      ['heytapbrowser', 'OPPO 浏览器'],
      ['vivobrowser', 'VIVO 浏览器'],
      ['edgios', 'Edge iOS'],
      ['edg', 'Edge'],
      ['crios', 'Chrome iOS'],
      ['chrome', 'Chrome'],
      ['safari', 'Safari'],
    ];

    function analyzeEnvironment() {
      const ua = navigator.userAgent.toLowerCase();

      if (ua.includes('iphone') || ua.includes('ipad')) reportData.os = 'iOS';
      else if (ua.includes('android')) reportData.os = 'Android';
      else if (ua.includes('harmonyos')) reportData.os = 'HarmonyOS';
      else if (ua.includes('windows')) reportData.os = 'Windows';
      else if (ua.includes('mac os')) reportData.os = 'macOS';

      if (ua.includes('huawei') || ua.includes('harmonyos')) reportData.brand = '华为';
      else if (ua.includes('honor')) reportData.brand = '荣耀';
      else if (ua.includes('xiaomi') || ua.includes('miui') || ua.includes('hyperos') || ua.includes('redmi')) reportData.brand = '小米/Redmi';
      else if (ua.includes('oppo') || ua.includes('heytap')) reportData.brand = 'OPPO';
      else if (ua.includes('vivo')) reportData.brand = 'VIVO';
      else if (ua.includes('iphone') || ua.includes('ipad')) reportData.brand = '苹果';
      else if (ua.includes('samsung')) reportData.brand = '三星';

      const modelMatch = navigator.userAgent.match(/\(([^)]+)\)/);
      reportData.model = modelMatch ? modelMatch[1] : '';

      const matchedBrowser = browserRules.find(([key]) => ua.includes(key));
      reportData.browser = matchedBrowser ? matchedBrowser[1] : 'WebKit/其他浏览器';

      const connection = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
      if (connection) {
        reportData.networkEffectiveType = connection.effectiveType || '';
        reportData.networkDownlink = Number.isFinite(connection.downlink) ? `${connection.downlink} Mbps` : '';
        reportData.networkRtt = Number.isFinite(connection.rtt) ? `${connection.rtt} ms` : '';
        reportData.networkType = connection.type || '';
        reportData.networkSaveData = connection.saveData ? '开启' : '关闭';
      }
    }

    async function lookupNetworkInfo() {
      try {
        const response = await fetch('/api/network-info');
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        reportData.clientIp = data.ip || '';
        reportData.ispName = data.ispName || '';
        reportData.ipAsn = data.ipAsn || '';
        reportData.ipCountry = data.ipCountry || '';
        reportData.ipRegion = data.ipRegion || '';
        reportData.ipCity = data.ipCity || '';
      } catch (error) {
        // 静默失败，不阻塞主流程
      }
    }

    async function testConnect(name, url, elementId) {
      const element = document.getElementById(elementId);
      const controller = new AbortController();
      const startedAt = Date.now();
      const timeoutId = setTimeout(() => controller.abort(), 7000);

      try {
        await fetch(`${url}${url.includes('?') ? '&' : '?'}_t=${Date.now()}`, {
          method: 'GET',
          mode: 'no-cors',
          cache: 'no-store',
          signal: controller.signal,
        });
        clearTimeout(timeoutId);
        const duration = Date.now() - startedAt;
        setStatus(element, `正常 ${duration}ms`, 'success');
        reportData.diagnostics[name] = { ok: true, duration, url };
        return reportData.diagnostics[name];
      } catch (error) {
        clearTimeout(timeoutId);
        const reason = error.name === 'AbortError' ? '连接超时' : '无法访问';
        setStatus(element, reason, 'error');
        reportData.diagnostics[name] = { ok: false, reason, url };
        return reportData.diagnostics[name];
      }
    }

    function setStatus(element, text, className) {
      element.textContent = text;
      element.className = `status ${className}`;
    }

    async function submitData() {
      const button = document.getElementById('submit-btn');
      const message = document.getElementById('message');
      reportData.testerName = document.getElementById('tester-name').value.trim();
      reportData.phone = document.getElementById('phone').value.trim();
      reportData.manualLocation = readSelectedLocation();

      if (!reportData.phone) {
        message.textContent = '请填写真实电话号码，否则无法准确解决您的问题。';
        return;
      }

      button.disabled = true;
      button.textContent = '正在诊断网络';
      message.textContent = '正在执行网络诊断，请稍候...';

      const diagnosticsSection = document.getElementById('diagnostics-section');
      diagnosticsSection.hidden = false;
      resetDiagnosticsStatus();

      const [domesticResult, targetResult, googleapisResult] = await Promise.all([
        testConnect('domestic', 'https://www.aliyun.com/favicon.ico', 'ping-domestic'),
        testConnect('target', TARGET_MAIN_SITE, 'ping-target'),
        testConnect('googleapis', 'https://www.googleapis.com', 'ping-google'),
      ]);
      reportData.networkSummary = [domesticResult, targetResult, googleapisResult]
        .map((value) => `${value.url}:${value.ok ? `${value.duration}ms` : value.reason}`)
        .join('; ');
      reportData.loginResult = targetResult.ok ? 'success' : 'failed';
      reportData.status = targetResult.ok ? 'resolved' : 'open';
      reportData.issue = targetResult.ok ? '目标登录地址可访问' : '目标登录地址无法访问';
      reportData.notes = targetResult.ok ? '用户端自动检测通过' : '用户端自动检测失败，等待技术服务处理';

      button.textContent = '正在提交';
      message.textContent = '网络诊断完成，正在提交测试记录...';

      try {
        const response = await fetch(recordsApi, {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify(reportData),
        });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        if (targetResult.ok) {
          alert('成功：您的浏览器可以正常访问目标登录地址。');
          message.textContent = '提交成功，目标网站访问正常。';
        } else {
          alert('已记录问题，技术服务会加急处理。');
          message.textContent = '已记录问题，技术服务会加急处理。';
        }
        button.textContent = '已提交';
      } catch (error) {
        message.textContent = `提交失败：${error.message}`;
        button.disabled = false;
        button.textContent = '重新提交测试记录';
      }
    }

    function resetDiagnosticsStatus() {
      [
        ['ping-domestic', '测试中'],
        ['ping-target', '测试中'],
        ['ping-google', '测试中'],
      ].forEach(([id, text]) => {
        const element = document.getElementById(id);
        element.textContent = text;
        element.className = 'status testing';
      });
      reportData.diagnostics = {};
      reportData.networkSummary = '';
    }

    async function loadAreas() {
      const province = document.getElementById('province');
      try {
        const response = await fetch('/data/areas.json');
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const areas = await response.json();
        populateAreas(areas);
      } catch (error) {
        province.innerHTML = '<option value="">行政区划数据加载失败，请刷新重试</option>';
      }
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (ch) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
      }[ch]));
    }

    function optionsHtml(entries) {
      return '<option value="">请选择</option>' + entries
        .map(([code, name]) => `<option value="${code}|${escapeHtml(name)}">${escapeHtml(name)}</option>`)
        .join('');
    }

    function populateAreas(areas) {
      const province = document.getElementById('province');
      const city = document.getElementById('city');
      const district = document.getElementById('district');

      const provinces = areas['86'] || {};
      province.innerHTML = optionsHtml(Object.entries(provinces));

      province.addEventListener('change', () => {
        const [code] = province.value.split('|');
        if (!code || !areas[code] || Object.keys(areas[code]).length === 0) {
          city.hidden = true;
          city.innerHTML = '<option value="">请选择城市</option>';
          district.hidden = true;
          district.innerHTML = '<option value="">请选择区/县</option>';
          return;
        }
        city.innerHTML = optionsHtml(Object.entries(areas[code]));
        city.hidden = false;
        district.hidden = true;
        district.innerHTML = '<option value="">请选择区/县</option>';
      });

      city.addEventListener('change', () => {
        const [code] = city.value.split('|');
        if (!code || !areas[code] || Object.keys(areas[code]).length === 0) {
          district.hidden = true;
          district.innerHTML = '<option value="">请选择区/县</option>';
          return;
        }
        district.innerHTML = optionsHtml(Object.entries(areas[code]));
        district.hidden = false;
      });
    }

    function readSelectedLocation() {
      const province = document.getElementById('province');
      const city = document.getElementById('city');
      const district = document.getElementById('district');
      const pName = province.value ? province.value.split('|')[1] : '';
      const cName = city.value ? city.value.split('|')[1] : '';
      const dName = district.value ? district.value.split('|')[1] : '';
      if (!pName) return '';
      // 直辖市：跳过无意义的"市辖区"层
      if (cName && (cName === '市辖区' || cName.endsWith('市辖区'))) {
        return dName ? `${pName}${dName}` : pName;
      }
      return [pName, cName, dName].filter(Boolean).join('');
    }

    window.addEventListener('load', () => {
      analyzeEnvironment();
      loadAreas();
      lookupNetworkInfo();
      document.getElementById('submit-btn').addEventListener('click', submitData);
    });
  </script>
</body>
</html>
