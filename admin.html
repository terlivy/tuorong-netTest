<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>手机测试记录后台</title>
  <style>
    :root {
      --bg: #eef2f6;
      --panel: #ffffff;
      --text: #17212f;
      --muted: #64748b;
      --line: #d6dee8;
      --blue: #1769aa;
      --green: #1f8a5b;
      --red: #bf3a30;
      --amber: #9a6500;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    header {
      padding: 20px 24px 12px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 24px;
      letter-spacing: 0;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    main {
      padding: 0 24px 24px;
    }

    .toolbar, .table-wrap, .access-panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    .access-panel {
      padding: 14px;
      margin-bottom: 14px;
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(140px, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }

    .metric {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      background: #f8fafc;
    }

    .metric strong {
      display: block;
      margin-top: 4px;
      font-size: 22px;
      color: var(--blue);
    }

    .metric.muted strong { color: var(--muted); }
    .metric.warn strong { color: var(--amber); }
    .metric.err strong { color: var(--red); }

    .access-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    .access-table th,
    .access-table td {
      text-align: right;
      padding: 6px 10px;
      border-bottom: 1px solid var(--line);
    }

    .access-table th:first-child,
    .access-table td:first-child {
      text-align: left;
    }

    .access-table tr.warn td { color: var(--amber); }
    .access-table tr.err td { color: var(--red); }

    .toolbar {
      display: grid;
      grid-template-columns: 2fr repeat(4, minmax(120px, 1fr)) auto auto;
      gap: 10px;
      align-items: end;
      padding: 14px;
      margin-bottom: 14px;
    }

    label {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 5px;
    }

    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 9px 10px;
      font: inherit;
      color: var(--text);
      background: #fff;
    }

    textarea {
      min-height: 68px;
      resize: vertical;
    }

    button, .file-label {
      border: 0;
      border-radius: 6px;
      padding: 10px 12px;
      background: var(--blue);
      color: #fff;
      font: inherit;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
      text-align: center;
    }

    .secondary { background: #475569; }
    .danger { background: var(--red); }
    .small { padding: 7px 9px; font-size: 13px; }

    .file-input { display: none; }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      min-width: 1180px;
      border-collapse: collapse;
    }

    th, td {
      border-bottom: 1px solid var(--line);
      padding: 10px;
      text-align: left;
      vertical-align: top;
      font-size: 13px;
    }

    th {
      background: #f8fafc;
      color: #334155;
      position: sticky;
      top: 0;
      z-index: 1;
    }

    .badge {
      display: inline-block;
      border-radius: 999px;
      padding: 3px 8px;
      font-size: 12px;
      font-weight: 800;
    }

    .open { background: #fff4cf; color: var(--amber); }
    .resolved { background: #def5e8; color: var(--green); }
    .blocked { background: #fde2df; color: var(--red); }
    .muted { color: var(--muted); }
    .actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .message { margin: 10px 0; color: var(--muted); font-size: 14px; }

    dialog {
      border: 0;
      border-radius: 8px;
      padding: 0;
      width: min(720px, calc(100vw - 28px));
      box-shadow: 0 20px 60px rgba(15, 23, 42, 0.25);
    }

    dialog::backdrop {
      background: rgba(15, 23, 42, 0.45);
    }

    .dialog-body {
      padding: 18px;
    }

    .dialog-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .full { grid-column: 1 / -1; }

    @media (max-width: 980px) {
      main, header { padding-left: 14px; padding-right: 14px; }
      .toolbar { grid-template-columns: 1fr 1fr; }
      .toolbar > div:first-child { grid-column: 1 / -1; }
      .kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      button, .file-label { width: 100%; }
    }

    @media (max-width: 620px) {
      .toolbar, .dialog-grid, .kpi-grid { grid-template-columns: 1fr; }
      .full { grid-column: auto; }
    }
  </style>
</head>
<body>
  <header>
    <h1>手机测试记录后台</h1>
    <p>记录电话号码、位置、手机信息、问题和解决方案，用于定位无法登录国外网站的原因。</p>
  </header>

  <main>
    <section class="access-panel">
      <h2>按日访问统计</h2>
      <p>所有 <code>42.192.109.248</code> 上的 HTTP 请求都会落到 <code>data/access-YYYY-MM-DD.jsonl</code>，下方按日聚合展示。点击「刷新」立即重读所有日志文件。</p>
      <div style="display:flex; gap:8px; align-items:end; margin-bottom:10px;">
        <div>
          <label for="access-days">最近天数</label>
          <input id="access-days" type="number" min="1" max="365" value="30" style="width:90px;">
        </div>
        <button type="button" id="access-refresh-btn">刷新</button>
        <span class="message" id="access-message" style="flex:1;"></span>
      </div>
      <div class="kpi-grid" id="access-kpis"></div>
      <table class="access-table" id="access-table">
        <thead>
          <tr>
            <th>日期</th>
            <th>请求数</th>
            <th>独立 IP</th>
            <th>平均延迟</th>
            <th>P95</th>
            <th>最大</th>
            <th>错误率</th>
            <th>5xx</th>
            <th>4xx</th>
            <th>主要路径</th>
          </tr>
        </thead>
        <tbody id="access-tbody">
          <tr><td colspan="10" style="text-align:center; color: var(--muted);">加载中…</td></tr>
        </tbody>
      </table>
    </section>

    <div class="toolbar">
      <div>
        <label for="query">关键词</label>
        <input id="query" placeholder="姓名、手机号、问题、方案、浏览器">
      </div>
      <div>
        <label for="status">状态</label>
        <select id="status">
          <option value="">全部</option>
          <option value="open">待处理</option>
          <option value="blocked">阻塞</option>
          <option value="resolved">已解决</option>
        </select>
      </div>
      <div>
        <label for="brand">品牌</label>
        <input id="brand" placeholder="华为/苹果">
      </div>
      <div>
        <label for="os">系统</label>
        <input id="os" placeholder="Android/iOS">
      </div>
      <div>
        <label for="browser">浏览器</label>
        <input id="browser" placeholder="微信/Safari">
      </div>
      <button type="button" id="export-btn">导出 CSV</button>
      <label class="file-label" for="import-file">导入 CSV</label>
      <input class="file-input" id="import-file" type="file" accept=".csv,text/csv">
    </div>

    <div class="message" id="message">正在加载记录...</div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>时间</th>
            <th>姓名</th>
            <th>电话</th>
            <th>位置</th>
            <th>状态</th>
            <th>手机信息</th>
            <th>登录结果</th>
            <th>问题</th>
            <th>解决方案</th>
            <th>网络诊断</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="records-body"></tbody>
      </table>
    </div>
  </main>

  <dialog id="edit-dialog">
    <form method="dialog" class="dialog-body" id="edit-form">
      <h2>编辑记录</h2>
      <input type="hidden" id="edit-id">
      <div class="dialog-grid">
        <div>
          <label for="edit-tester-name">姓名</label>
          <input id="edit-tester-name">
        </div>
        <div>
          <label for="edit-phone">电话号码</label>
          <input id="edit-phone">
        </div>
        <div>
          <label for="edit-manual-location">所在城市/地区</label>
          <input id="edit-manual-location">
        </div>
        <div class="full">
          <label for="edit-location-address">定位地址</label>
          <input id="edit-location-address">
        </div>
        <div>
          <label for="edit-status">状态</label>
          <select id="edit-status">
            <option value="open">待处理</option>
            <option value="blocked">阻塞</option>
            <option value="resolved">已解决</option>
          </select>
        </div>
        <div class="full">
          <label for="edit-issue">问题</label>
          <textarea id="edit-issue"></textarea>
        </div>
        <div class="full">
          <label for="edit-solution">解决方案</label>
          <textarea id="edit-solution"></textarea>
        </div>
        <div class="full">
          <label for="edit-notes">备注</label>
          <textarea id="edit-notes"></textarea>
        </div>
      </div>
      <div class="actions" style="margin-top:14px;">
        <button type="submit">保存</button>
        <button type="button" class="secondary" id="cancel-edit">取消</button>
      </div>
    </form>
  </dialog>

  <script>
    const state = { records: [] };
    const filters = ['query', 'status', 'brand', 'os', 'browser'];

    function escapeHtml(value) {
      return String(value || '').replace(/[&<>"']/g, (char) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;',
      }[char]));
    }

    function formatDate(value) {
      if (!value) return '';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return value;
      return date.toLocaleString('zh-CN', { hour12: false });
    }

    function statusLabel(status) {
      return { open: '待处理', blocked: '阻塞', resolved: '已解决' }[status] || status || '待处理';
    }

    function formatCoordinates(record) {
      if (!record.latitude || !record.longitude) return '';
      const accuracy = record.locationAccuracy ? ` / ${record.locationAccuracy}m` : '';
      return `${record.latitude}, ${record.longitude}${accuracy}`;
    }

    function buildParams() {
      const params = new URLSearchParams();
      filters.forEach((id) => {
        const value = document.getElementById(id).value.trim();
        if (value) params.set(id, value);
      });
      return params.toString();
    }

    async function loadRecords() {
      const response = await fetch(`/api/records?${buildParams()}`);
      const data = await response.json();
      state.records = data.records || [];
      renderRecords();
    }

    function renderRecords() {
      const body = document.getElementById('records-body');
      const message = document.getElementById('message');
      message.textContent = `共 ${state.records.length} 条记录`;
      body.innerHTML = state.records.map((record) => `
        <tr>
          <td>${escapeHtml(formatDate(record.createdAt))}<br><span class="muted">${escapeHtml(formatDate(record.updatedAt))}</span></td>
          <td>${escapeHtml(record.testerName)}</td>
          <td>${escapeHtml(record.phone)}</td>
          <td>
            ${escapeHtml(record.manualLocation)}<br>
            <span class="muted">${escapeHtml(record.locationAddress)}</span><br>
            <span class="muted">${escapeHtml(formatCoordinates(record))}</span>
          </td>
          <td><span class="badge ${escapeHtml(record.status || 'open')}">${escapeHtml(statusLabel(record.status))}</span></td>
          <td>
            ${escapeHtml(record.brand)} ${escapeHtml(record.model)}<br>
            <span class="muted">${escapeHtml(record.os)} / ${escapeHtml(record.browser)}</span><br>
            <span class="muted">${escapeHtml(record.screen)}</span>
          </td>
          <td>${escapeHtml(record.loginResult)}</td>
          <td>${escapeHtml(record.issue)}</td>
          <td>${escapeHtml(record.solution)}</td>
          <td>${escapeHtml(record.networkSummary)}</td>
          <td>
            <div class="actions">
              <button class="small" type="button" onclick="openEdit('${record.id}')">编辑</button>
              <button class="small danger" type="button" onclick="deleteRecord('${record.id}')">删除</button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    function openEdit(id) {
      const record = state.records.find((item) => item.id === id);
      if (!record) return;
      document.getElementById('edit-id').value = record.id;
      document.getElementById('edit-tester-name').value = record.testerName || '';
      document.getElementById('edit-phone').value = record.phone || '';
      document.getElementById('edit-manual-location').value = record.manualLocation || '';
      document.getElementById('edit-location-address').value = record.locationAddress || '';
      document.getElementById('edit-status').value = record.status || 'open';
      document.getElementById('edit-issue').value = record.issue || '';
      document.getElementById('edit-solution').value = record.solution || '';
      document.getElementById('edit-notes').value = record.notes || '';
      document.getElementById('edit-dialog').showModal();
    }

    async function saveEdit(event) {
      event.preventDefault();
      const id = document.getElementById('edit-id').value;
      await fetch(`/api/records/${encodeURIComponent(id)}`, {
        method: 'PUT',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({
          testerName: document.getElementById('edit-tester-name').value,
          phone: document.getElementById('edit-phone').value,
          manualLocation: document.getElementById('edit-manual-location').value,
          locationAddress: document.getElementById('edit-location-address').value,
          status: document.getElementById('edit-status').value,
          issue: document.getElementById('edit-issue').value,
          solution: document.getElementById('edit-solution').value,
          notes: document.getElementById('edit-notes').value,
        }),
      });
      document.getElementById('edit-dialog').close();
      await loadRecords();
    }

    async function deleteRecord(id) {
      if (!confirm('确定删除这条记录吗？')) return;
      await fetch(`/api/records/${encodeURIComponent(id)}`, { method: 'DELETE' });
      await loadRecords();
    }

    function exportCsv() {
      window.location.href = '/api/records/export';
    }

    async function importCsv(event) {
      const file = event.target.files[0];
      if (!file) return;
      const text = await file.text();
      const response = await fetch('/api/records/import', {
        method: 'POST',
        headers: { 'content-type': 'text/csv' },
        body: text,
      });
      const result = await response.json();
      document.getElementById('message').textContent = `已导入 ${result.imported || 0} 条记录`;
      event.target.value = '';
      await loadRecords();
    }

    async function loadAccessSummary() {
      const button = document.getElementById('access-refresh-btn');
      const message = document.getElementById('access-message');
      const days = Number(document.getElementById('access-days').value) || 30;
      button.disabled = true;
      message.textContent = '正在聚合访问日志…';
      try {
        const response = await fetch(`/api/access/summary?days=${encodeURIComponent(days)}`);
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || `HTTP ${response.status}`);
        renderAccessKpis(result);
        renderAccessTable(result.daily || []);
        message.textContent = `已加载 ${result.days}/${result.requestedDays} 天的访问统计。`;
      } catch (error) {
        message.textContent = `加载失败：${error.message}`;
      } finally {
        button.disabled = false;
      }
    }

    function renderAccessKpis(result) {
      const daily = (result.daily || []).slice();
      const totalRequests = daily.reduce((sum, day) => sum + (day.total || 0), 0);
      const last = daily.length ? daily[daily.length - 1] : null;
      const lastTotal = last ? last.total : 0;
      const lastUniqueIps = last ? last.uniqueIps : 0;
      const lastAvgLatency = last ? last.averageLatencyMs : 0;
      const lastErrorRate = last ? last.errorRate : 0;

      const errorClass = lastErrorRate >= 0.05 ? 'err' : lastErrorRate >= 0.01 ? 'warn' : '';
      const latencyClass = lastAvgLatency >= 500 ? 'err' : lastAvgLatency >= 200 ? 'warn' : '';

      const kpis = [
        { label: '区间请求总数', value: totalRequests, cls: '' },
        { label: '最近一天请求数', value: lastTotal, cls: '' },
        { label: '最近一天独立 IP', value: lastUniqueIps, cls: '' },
        { label: '最近一天平均延迟', value: `${lastAvgLatency} ms`, cls: latencyClass },
      ];
      const container = document.getElementById('access-kpis');
      container.innerHTML = kpis.map((kpi) => `
        <div class="metric ${kpi.cls}">
          <span class="muted">${escapeHtml(kpi.label)}</span>
          <strong>${escapeHtml(kpi.value)}</strong>
        </div>
      `).join('');
    }

    function renderAccessTable(daily) {
      const tbody = document.getElementById('access-tbody');
      if (!daily.length) {
        tbody.innerHTML = `<tr><td colspan="10" style="text-align:center; color: var(--muted);">还没有访问日志。请稍后再来刷新，或在手机上打开 test.html 提交几次记录。</td></tr>`;
        return;
      }
      const sorted = daily.slice().reverse();
      tbody.innerHTML = sorted.map((day) => {
        const errorRatePct = (day.errorRate * 100).toFixed(2);
        const rowCls = day.serverErrors > 0 ? 'err' : day.clientErrors > 0 ? 'warn' : '';
        const topPath = day.topPaths && day.topPaths.length
          ? `${escapeHtml(day.topPaths[0].path)}×${day.topPaths[0].count}`
          : '-';
        return `
          <tr class="${rowCls}">
            <td>${escapeHtml(day.date)}</td>
            <td>${day.total}</td>
            <td>${day.uniqueIps}</td>
            <td>${day.averageLatencyMs} ms</td>
            <td>${day.p95LatencyMs} ms</td>
            <td>${day.maxLatencyMs} ms</td>
            <td>${errorRatePct}%</td>
            <td>${day.serverErrors || 0}</td>
            <td>${day.clientErrors || 0}</td>
            <td style="text-align:left; color: var(--muted); font-size:12px;">${topPath}</td>
          </tr>
        `;
      }).join('');
    }

    filters.forEach((id) => document.getElementById(id).addEventListener('input', loadRecords));
    document.getElementById('access-refresh-btn').addEventListener('click', loadAccessSummary);
    document.getElementById('export-btn').addEventListener('click', exportCsv);
    document.getElementById('import-file').addEventListener('change', importCsv);
    document.getElementById('edit-form').addEventListener('submit', saveEdit);
    document.getElementById('cancel-edit').addEventListener('click', () => document.getElementById('edit-dialog').close());
    loadRecords();
    loadAccessSummary();
  </script>
</body>
</html>
